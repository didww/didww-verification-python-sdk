[build-system]
# setuptools, not hatchling: hatchling's default sdist ships every VCS-tracked file.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "didww-verification"
dynamic = ["version"]
description = "Python SDK for the DIDWW Verification API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DIDWW", email = "support@didww.com" }]
keywords = ["didww", "otp", "verification", "sms", "2fa", "telephony", "api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.0,<3",
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://github.com/didww/didww-verification-python-sdk"
Documentation = "https://doc.didww.com/otp-verification/index.html"
Repository = "https://github.com/didww/didww-verification-python-sdk"
Issues = "https://github.com/didww/didww-verification-python-sdk/issues"
Changelog = "https://github.com/didww/didww-verification-python-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "anyio>=4.0",
    "mypy>=1.11",
    "pyright>=1.1.400",
    "ruff>=0.6",
    "typing_extensions>=4.12",
    "build>=1.2",
    "twine>=6.1",
    # So the optional adapters are actually checked. Neither is a runtime dependency.
    "starlette>=0.37",
    "django>=4.2",
    # Django ships no inline types.
    "django-stubs>=5.0",
]

[tool.setuptools.dynamic]
version = { attr = "didww_verification._version.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
didww_verification = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

# The adapters import their framework only under TYPE_CHECKING.
[[tool.mypy.overrides]]
module = ["starlette.*", "django.*"]
ignore_missing_imports = true

[tool.pyright]
# src only: pytest decorators are untypable in strict mode and the noise buries findings.
include = ["src", "tests/typing"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "strict"
# A rejection that stops firing leaves an unnecessary ignore, which then fails the build.
reportUnnecessaryTypeIgnoreComment = "error"
# Otherwise pyright honours mypy's blanket "# type: ignore" and its own assertions
# are silently suppressed.
enableTypeIgnoreComments = false

[tool.coverage.run]
source = ["didww_verification"]
branch = true
